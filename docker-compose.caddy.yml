# HTTPS overlay — Caddy with automatic Let's Encrypt certificates.
#
# This is an *override*, not a standalone stack. Use it together with the base
# file, which owns the API, workers, watcher, recovery, Redis and wa-bridge:
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# It used to be a full copy of the base file, which is how it silently drifted:
# after the queue refactor it still described the old single-container stack, so
# an HTTPS deploy would have come up with no Redis and no workers.
#
# nginx is not started here: it sits behind the "nginx" profile in the base file.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      STOCKLY_DOMAIN: ${STOCKLY_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
